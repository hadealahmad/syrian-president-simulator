<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1b18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="رئيس الجمهورية" />
    <title>رئيس الجمهورية | محاكاة إدارة واقتصاد سوريا ما بعد الحرب</title>
    <!-- Theming engine: stamp the persisted theme before first paint (no flash).
         Source of truth for ids: src/lib/themes.ts (`THEME_STORAGE_KEY`). -->
    <script>
      try {
        var __th = localStorage.getItem('president-theme-v1');
        if (__th) document.documentElement.dataset.theme = __th;
      } catch (e) {}
    </script>
  </head>
  <body class="bg-charcoal-deep text-wheat-light font-['Thmanyah_Sans',sans-serif] overflow-hidden">
    <div id="app" class="w-full h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
