<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة العمليات — محاكي الرئيس السوري</title>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyah/thmanyah-sans-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyah/thmanyah-sans-medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyah/thmanyah-sans-bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url('/fonts/thmanyah/thmanyah-serif-display-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url('/fonts/thmanyah/thmanyah-serif-display-medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url('/fonts/thmanyah/thmanyah-serif-display-bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --deep:#071210; --fd:#0a1b18; --fm:#133832; --fs:#1a453e;
  --teal:#4ec7b4; --wheat:#f7f5ed; --wheat2:#dfcaa0; --gold:#f2cf77;
  --umber:#240c11; --crimson:#f87171; --danger:#ce1126; --ok:#3fb950; --warn:#f5d547;
  --line:rgba(223,202,160,.14); --line2:rgba(223,202,160,.26);
  --serif:'Thmanyah Serif','Thmanyah Sans',Georgia,serif;
  --sans:'Thmanyah Sans',system-ui,-apple-system,sans-serif;
  --hud-top:72px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--wheat);background:var(--deep);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate}
button{font-family:inherit;color:inherit;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
.ic{display:inline-block;vertical-align:middle;flex:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(223,202,160,.2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- glass ---------- */
.glass{
  background:linear-gradient(168deg,rgba(26,69,62,.72) 0%,rgba(10,27,24,.88) 55%,rgba(7,18,16,.92) 100%);
  border:1px solid var(--line);
  box-shadow:0 18px 40px -22px #000,inset 0 1px 0 rgba(247,245,237,.08);
  -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
}

/* ---------- map ---------- */
.mapwrap{
  position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1100px 720px at 58% 34%,#123a32 0%,#081a17 46%,#040d0b 100%);
}
.mapwrap::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(circle,rgba(223,202,160,.12) 1px,transparent 1.5px);
  background-size:30px 30px;opacity:.42;
  -webkit-mask-image:radial-gradient(85% 80% at 52% 46%,#000 15%,transparent 80%);
  mask-image:radial-gradient(85% 80% at 52% 46%,#000 15%,transparent 80%);
}
#map{position:absolute;inset:0;width:100%;height:calc(100% - 185px);z-index:1;display:block}
.mapwrap::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,12,10,.92) 0%,rgba(4,12,10,.45) 9%,transparent 24%,transparent 70%,rgba(4,12,10,.55) 88%,rgba(4,12,10,.95) 100%);
}
.pins{position:absolute;inset:0;z-index:3;pointer-events:none}

.prov{
  fill:var(--fill);stroke:var(--stroke);stroke-width:1.15;vector-effect:non-scaling-stroke;
  transition:fill .2s ease,stroke .2s ease,filter .2s ease;cursor:pointer;pointer-events:auto;
}
.prov[data-tier="CALM"]{--fill:rgba(61,182,160,.22);--stroke:rgba(78,199,180,.62);--pin:#4ec7b4}
.prov[data-tier="TENSE"]{--fill:rgba(242,207,119,.19);--stroke:rgba(242,207,119,.55);--pin:#f2cf77}
.prov[data-tier="RIOT"]{--fill:rgba(245,158,11,.24);--stroke:rgba(245,158,11,.62);--pin:#f5a623}
.prov[data-tier="REVOLT"]{--fill:rgba(206,17,38,.3);--stroke:rgba(248,113,113,.72);--pin:#f87171}
.prov:hover{fill:rgba(78,199,180,.26);stroke:rgba(78,199,180,.95);stroke-width:1.8;filter:drop-shadow(0 0 9px rgba(78,199,180,.45))}
.prov.sel{stroke:var(--gold);stroke-width:2.2;fill:rgba(242,207,119,.28);filter:drop-shadow(0 0 12px rgba(242,207,119,.4))}
.shadowlayer path{fill:#02100d;opacity:.75}
.shadowlayer{filter:blur(7px);transform:translate(6px,11px)}
.nb{fill:rgba(223,202,160,.34);font-family:var(--sans);font-size:21px;letter-spacing:5px;font-weight:500}

.pin{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:4px;cursor:pointer;pointer-events:auto;color:var(--wheat);z-index:1;
  transition:transform .18s ease;
}
.pin:hover{transform:translate(-50%,-50%) scale(1.08);z-index:5}
.pin:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:99px}
.pin-name{
  font-size:11px;font-weight:500;line-height:1.5;padding:1px 7px;border-radius:7px;white-space:nowrap;
  background:rgba(7,18,16,.62);border:1px solid rgba(223,202,160,.16);text-shadow:0 1px 3px #000;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.pin-dot{
  min-width:21px;height:21px;padding:0 4px;border-radius:99px;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;color:#07120f;background:var(--pin,#f2cf77);
  border:1px solid rgba(7,18,16,.45);box-shadow:0 0 0 2px rgba(7,18,16,.55),0 3px 10px rgba(0,0,0,.55);
  transition:box-shadow .2s;
}
.pin.sel .pin-name{border-color:rgba(242,207,119,.6);color:var(--gold)}
.pin.sel .pin-dot{box-shadow:0 0 0 2px rgba(7,18,16,.6),0 0 0 4px rgba(242,207,119,.35),0 0 18px rgba(242,207,119,.55)}
.mapwrap.compact .pin-name{display:none}
.mapwrap.compact .pin.sel .pin-name{display:block}
.mapwrap.compact .pin{padding:12px}
.mapwrap.compact .pin-dot{min-width:18px;height:18px;font-size:8.5px}
.mapwrap.compact .nb,.mapwrap.compact .compass{display:none}
.lower{display:none}

/* ---------- top HUD ---------- */
.topbar{
  position:absolute;inset-block-start:0;inset-inline:0;z-index:40;display:flex;gap:9px;align-items:stretch;
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-right:calc(14px + env(safe-area-inset-right));
  padding-left:calc(238px + env(safe-area-inset-left));
  pointer-events:none;
}
.topbar>*{pointer-events:auto}
.turnblock{
  border-radius:14px;padding:7px 14px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  min-width:124px;flex:none;
}
.tl{font-size:10px;color:rgba(223,202,160,.7);letter-spacing:.6px;display:flex;align-items:baseline;gap:4px}
.tnum{display:inline-flex;align-items:baseline;gap:1px;direction:ltr}
.tl b{font-family:var(--serif);font-size:22px;line-height:1;color:var(--wheat);letter-spacing:.5px}
.tl i{font-style:normal;font-size:10px;color:rgba(223,202,160,.5)}
.tseason{font-size:9.5px;color:rgba(223,202,160,.62);letter-spacing:.4px;display:flex;align-items:center;gap:4px;margin-top:3px}
.tseason .ic{color:var(--gold);opacity:.8}

.resbar{
  flex:1;min-width:0;display:flex;align-items:center;gap:2px;border-radius:14px;padding:0 3px;
  cursor:pointer;transition:border-color .2s,box-shadow .2s;
}
.resbar:hover{border-color:rgba(78,199,180,.36);box-shadow:0 18px 40px -22px #000,inset 0 1px 0 rgba(247,245,237,.1),0 0 0 1px rgba(78,199,180,.1)}
.res-list{flex:1;display:flex;align-items:center;min-width:0}
.res{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:7px 8px;position:relative}
.res+.res::before{content:'';position:absolute;inset-block:12px;inset-inline-start:0;width:1px;background:var(--line)}
.ricon{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--rc) 24%,transparent);
}
.rbody{min-width:0;display:flex;flex-direction:column;gap:1px}
.rval{display:flex;align-items:baseline;gap:3px;min-width:0}
.rnum{font-family:var(--serif);font-size:20px;line-height:1;letter-spacing:.2px;color:var(--wheat);white-space:nowrap}
.runit{font-style:normal;font-size:9px;color:rgba(223,202,160,.62);white-space:nowrap}
.rlabel{font-size:8.5px;color:rgba(223,202,160,.56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.chip{
  display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:99px;font-size:9.5px;font-weight:500;
  line-height:1.45;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;
}
.chip.good{color:#84e6d5;background:rgba(78,199,180,.12);border:1px solid rgba(78,199,180,.3)}
.chip.bad{color:#ffa6a6;background:rgba(206,17,38,.17);border:1px solid rgba(248,113,113,.3)}
.chip.mut{color:var(--wheat2);background:rgba(223,202,160,.07);border:1px solid var(--line)}
.res .chip{margin-inline-start:2px}
.res-chev{flex:none;width:24px;display:grid;place-items:center;color:rgba(223,202,160,.5);transition:transform .25s}
.resbar.open .res-chev{transform:rotate(180deg)}

/* intelligence tray */
.tray{
  position:absolute;z-index:39;top:calc(var(--hud-top) + env(safe-area-inset-top));
  left:50%;width:min(930px,calc(100% - 28px));max-height:min(64dvh,470px);overflow:auto;
  border-radius:18px;padding:15px 16px 13px;
  transform:translateX(-50%) translateY(-10px);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .24s ease,transform .28s cubic-bezier(.2,.9,.3,1),visibility .24s;
}
.tray.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);pointer-events:auto}
.tray-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.tray-head .th-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--teal);background:rgba(78,199,180,.1);border:1px solid rgba(78,199,180,.22)}
.tray-head h3{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.2px}
.tray-head p{font-size:9.5px;color:rgba(223,202,160,.55);margin-top:1px}
.tray-head .icon-btn{margin-inline-start:auto}
.tray-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gauge{padding:9px 11px;border-radius:12px;background:rgba(7,18,16,.42);border:1px solid rgba(223,202,160,.08)}
.gauge .gl{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:10px;color:rgba(223,202,160,.68)}
.gauge .gl b{font-family:var(--serif);font-size:16px;color:var(--wheat);font-weight:500}
.gauge .gl .chip{font-size:8.5px;padding:1px 5px}
.gbar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--gc,var(--teal));box-shadow:0 0 10px -2px var(--gc,var(--teal))}
.tray-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:rgba(223,202,160,.62)}
.tray-foot .ic{color:var(--gold)}

/* ---------- hand ---------- */
.hand{
  position:absolute;inset-inline:0;bottom:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
  padding:46px 12px calc(30px + env(safe-area-inset-bottom));
  padding-inline-end:150px;
  pointer-events:none;
  transition:transform .4s cubic-bezier(.3,.9,.3,1),opacity .3s,filter .3s;
}
.card{
  pointer-events:auto;position:relative;flex:none;width:clamp(142px,11.6vw,168px);aspect-ratio:.76;
  margin-inline:-16px;border-radius:14px;border:1px solid rgba(223,202,160,.24);overflow:hidden;
  display:flex;flex-direction:column;padding:13px 11px 12px;text-align:start;cursor:pointer;
  background:linear-gradient(176deg,#1d5048 0%,#11312b 46%,#081a17 100%);
  box-shadow:0 22px 34px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(247,245,237,.12);
  transform:translateY(var(--dy,0)) rotate(var(--rot,0deg));transform-origin:50% 100%;
  z-index:var(--z,10);color:var(--wheat);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.15),box-shadow .28s,filter .28s;
  animation:cardIn .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0)*55ms);
}
.card::before{content:'';position:absolute;inset-block-start:0;inset-inline:0;height:4px;background:var(--cat,#4ec7b4);opacity:.95}
.card::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 60% at 78% 0%,rgba(78,199,180,.14),transparent 62%);pointer-events:none}
.card:hover,.card:focus-visible{
  transform:translateY(-28px) rotate(0deg) scale(1.055);z-index:40;
  box-shadow:0 34px 60px -18px rgba(0,0,0,.9),0 0 0 1px rgba(242,207,119,.22),inset 0 1px 0 rgba(247,245,237,.16);
  outline:none;
}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.c-cat{display:flex;align-items:center;gap:4px;font-size:8.5px;letter-spacing:.6px;color:rgba(223,202,160,.8);padding-inline-end:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cat i{width:5px;height:5px;border-radius:50%;background:var(--cat);flex:none;box-shadow:0 0 6px var(--cat)}
.c-seal{
  position:absolute;inset-block-start:9px;inset-inline-end:9px;width:34px;height:34px;display:grid;place-items:center;
  align-content:center;border-radius:48% 52% 50% 50%/52% 46% 54% 48%;
  background:radial-gradient(circle at 34% 28%,#2b6f61,#0a2320 72%);
  border:1px solid rgba(242,207,119,.6);box-shadow:inset 0 0 0 2px rgba(242,207,119,.14),0 3px 8px rgba(0,0,0,.45);
  z-index:2;
}
.c-seal b{font-family:var(--serif);font-size:14px;line-height:1;color:var(--gold);font-weight:700}
.c-seal i{font-style:normal;font-size:6px;line-height:1.4;color:rgba(242,207,119,.72);letter-spacing:.2px}
.c-seal.gain{border-color:rgba(78,199,180,.7);background:radial-gradient(circle at 34% 28%,#1d5b50,#08201c 72%)}
.c-seal.gain b{color:#8ff0df}
.c-seal.gain i{color:rgba(143,240,223,.7)}
.c-title{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1.42;margin-top:8px;position:relative;z-index:2;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-blurb{font-size:8.5px;line-height:1.6;color:rgba(223,202,160,.52);margin-top:5px;position:relative;z-index:2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-fx{margin-top:auto;padding-top:6px;border-top:1px solid rgba(223,202,160,.12);display:flex;flex-direction:column;gap:4px;position:relative;z-index:2}
.c-fxhead{font-size:7px;letter-spacing:1.1px;color:rgba(223,202,160,.4);margin-bottom:1px}
.fxrow{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(223,202,160,.82);min-width:0}
.fxrow .ic{opacity:.8}
.fxrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxrow b{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:10.5px;letter-spacing:.2px}
.fxrow b.g{color:#7fe3d1}
.fxrow b.r{color:#ff9b9b}
.c-money{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(223,202,160,.66);margin-top:5px;position:relative;z-index:2}
.c-watermark{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);opacity:.05;color:var(--wheat);pointer-events:none;z-index:0}
.handhead{display:none}

/* ---------- end turn seal + pending ---------- */
.sealwrap{
  position:fixed;z-index:48;inset-block-end:calc(18px + env(safe-area-inset-bottom));
  inset-inline-start:calc(20px + env(safe-area-inset-left));
  display:flex;flex-direction:column-reverse;align-items:flex-start;gap:10px;direction:ltr;
}
.seal{
  position:relative;width:96px;height:96px;border-radius:50%;border:0;padding:0;cursor:pointer;flex:none;
  background:transparent;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(242,207,119,.16));
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2),filter .25s;
}
.seal:hover{transform:translateY(-3px) scale(1.035);filter:drop-shadow(0 16px 24px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(242,207,119,.3))}
.seal:active{transform:scale(.965)}
.seal svg{width:100%;height:100%;display:block;transition:transform .4s}
.seal:hover svg{transform:rotate(-4deg)}
.seal text{font-family:var(--serif);font-weight:700;fill:#3a2705;letter-spacing:.3px}
.seal-badge{
  position:absolute;inset-block-start:-3px;inset-inline-start:-3px;min-width:24px;height:24px;padding:0 5px;border-radius:99px;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#2a1b02;
  background:linear-gradient(180deg,#fff5d2,#f2cf77);border:1px solid #fff6d8;
  box-shadow:0 3px 10px rgba(0,0,0,.5);z-index:3;
}
.pending{direction:rtl;width:auto;max-width:210px;border-radius:13px;padding:0;overflow:hidden;transition:width .25s}
.pend-head{
  display:flex;align-items:center;gap:7px;width:100%;padding:8px 11px;border:0;background:transparent;
  cursor:pointer;font-size:10.5px;color:rgba(223,202,160,.82);text-align:start;min-height:40px;
}
.pend-head .ic{color:var(--gold);opacity:.85}
.pend-head b{margin-inline-start:auto;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;
  font-size:10px;color:#2a1b02;background:var(--gold)}
.pend-ch{display:grid;place-items:center;color:rgba(223,202,160,.45);transition:transform .25s}
.pending.exp .pend-ch{transform:rotate(180deg)}
.pend-body{display:none;padding:0 11px 10px}
.pending.exp .pend-body{display:block}
.pi{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid rgba(223,202,160,.1);font-size:10px}
.pi i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--gold));flex:none}
.pi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(247,245,237,.88)}
.pi b{font-size:10px;color:var(--gold);white-space:nowrap}
.pi b i{font-style:normal;font-size:8px;opacity:.6}
.pend-total{display:flex;justify-content:space-between;gap:6px;padding-top:7px;margin-top:2px;border-top:1px solid rgba(223,202,160,.18);font-size:9.5px;color:rgba(223,202,160,.6)}
.pend-total b{color:var(--gold);font-variant-numeric:tabular-nums}

/* ---------- province overlay ---------- */
.pv-layer{position:fixed;inset:0;z-index:38;pointer-events:none;display:none}
body[data-state="2"] .pv-layer{display:block}
.pv-ring{
  position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid var(--teal);box-shadow:0 0 0 5px rgba(78,199,180,.1),0 0 20px rgba(78,199,180,.5);
  pointer-events:none;animation:ringPulse 2.6s ease-out infinite;
}
.pv-leader{position:absolute;height:0;border-top:2px dashed rgba(78,199,180,.85);transform-origin:0 50%;pointer-events:none;
  filter:drop-shadow(0 0 5px rgba(78,199,180,.65))}
.prov-card{
  position:absolute;width:322px;max-height:calc(100dvh - 120px);overflow:auto;pointer-events:auto;
  border-radius:18px;padding:15px 15px 13px;border-color:rgba(78,199,180,.34);
  box-shadow:0 34px 60px -22px #000,inset 0 1px 0 rgba(247,245,237,.1);
  animation:pvIn .32s cubic-bezier(.2,.9,.3,1.1) both;
}
.pc-head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.pc-eyebrow{font-size:8.5px;letter-spacing:1.8px;color:var(--teal);opacity:.9;display:flex;align-items:center;gap:4px}
.pc-head h2{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.1;margin:3px 0 2px}
.pc-head p{font-size:10px;color:rgba(223,202,160,.6)}
.pc-tierrow{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:9px 0 11px}
.pc-tier{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:9.5px;font-weight:500;
  color:var(--tc,#f2cf77);background:color-mix(in srgb,var(--tc,#f2cf77) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--tc,#f2cf77) 35%,transparent);
}
.pc-tier::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--tc);box-shadow:0 0 7px var(--tc)}
.pc-prri{font-size:10px;color:rgba(223,202,160,.62)}
.pc-prri b{font-family:var(--serif);font-size:15px;color:var(--wheat)}
.meter{margin-bottom:8px}
.mt{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:10px;color:rgba(223,202,160,.72);margin-bottom:3px}
.mt b{font-size:10.5px;color:var(--wheat);font-weight:500;font-variant-numeric:tabular-nums}
.mbar{height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;background:var(--mc,var(--teal));box-shadow:0 0 9px -2px var(--mc,var(--teal))}
.pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:11px 0 0}
.pcs{padding:6px 8px;border-radius:9px;background:rgba(7,18,16,.4);border:1px solid rgba(223,202,160,.07)}
.pcs span{display:block;font-size:8.5px;color:rgba(223,202,160,.55);margin-bottom:1px}
.pcs b{font-family:var(--serif);font-size:13.5px;font-weight:500;color:var(--wheat)}
.pcs b i{font-style:normal;font-size:8px;color:rgba(223,202,160,.55);margin-inline-start:2px}
.proj{margin-top:10px;padding:10px;border-radius:12px;border:1px solid rgba(242,207,119,.22);
  background:linear-gradient(170deg,rgba(242,207,119,.09),rgba(7,18,16,.3))}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tag{font-size:8.5px;letter-spacing:.8px;color:var(--gold);opacity:.9}
.proj-cost{font-size:9px;color:rgba(223,202,160,.7);font-variant-numeric:tabular-nums}
.proj h4{font-family:var(--serif);font-size:13.5px;font-weight:700;margin:4px 0 2px;line-height:1.4}
.proj p{font-size:9.5px;color:rgba(223,202,160,.6);line-height:1.6}
.proj-fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fxchip{display:inline-flex;align-items:center;gap:3px;font-size:8.5px;padding:1px 5px;border-radius:6px;border:1px solid transparent}
.fxchip.g{color:#8ff0df;background:rgba(78,199,180,.1);border-color:rgba(78,199,180,.22)}
.fxchip.r{color:#ffaaaa;background:rgba(206,17,38,.13);border-color:rgba(248,113,113,.22)}
.pc-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0 12px;border-radius:11px;
  border:1px solid var(--line2);background:rgba(26,69,62,.55);color:var(--wheat);font-size:11.5px;font-weight:500;
  cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;text-align:center;line-height:1.3;
}
.btn:hover{background:rgba(30,80,71,.82);border-color:rgba(78,199,180,.5)}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,#f8e6b0,#e9c265 60%,#d8ab42);color:#241a04;border-color:#f2cf77;font-weight:700;
  box-shadow:0 8px 20px -9px rgba(242,207,119,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.gold:hover{filter:brightness(1.05);background:linear-gradient(180deg,#fdf0c9,#efcc73 60%,#dcb04a)}
.btn.ghost{background:rgba(7,18,16,.42)}
.btn em{font-style:normal;font-size:9px;opacity:.62}
.btn.done{border-color:rgba(78,199,180,.5);color:#8ff0df;background:rgba(78,199,180,.1)}
.btn.wide{width:100%}
.icon-btn{
  width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);
  background:rgba(7,18,16,.4);color:rgba(223,202,160,.7);cursor:pointer;transition:.16s;
}
.icon-btn:hover{color:var(--wheat);border-color:rgba(78,199,180,.45);background:rgba(19,56,50,.6)}

/* ---------- inspect ---------- */
.layer{display:none}
#inspectLayer{
  position:fixed;inset:0;z-index:45;display:none;place-items:center;padding:16px;
  background:rgba(4,11,9,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
body[data-state="3"] #inspectLayer{display:grid}
body[data-state="3"] .hand{transform:translateY(150px) scale(.96);opacity:.3;filter:blur(1.5px);pointer-events:none}
body[data-state="3"] .handhead{opacity:0}
body[data-state="3"] .pending{width:212px}
body[data-state="3"] .pending .pend-body{display:block}
.inspect{
  position:relative;width:min(372px,94vw);max-height:min(88dvh,800px);display:flex;flex-direction:column;
  border-radius:18px;overflow:hidden;border:1px solid rgba(242,207,119,.34);
  background:linear-gradient(170deg,#1b4d44 0%,#0d2a25 48%,#071915 100%);
  box-shadow:0 40px 90px -25px #000,inset 0 1px 0 rgba(247,245,237,.12);
  animation:dealIn .38s cubic-bezier(.2,.9,.3,1.06) both;
}
.inspect::before{content:'';position:absolute;inset-block-start:0;inset-inline:0;height:5px;background:var(--cat,var(--teal));z-index:2}
.ins-scroll{overflow:auto;padding:17px 17px 6px;flex:1}
.ins-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ins-cat{font-size:9px;letter-spacing:.9px;color:var(--cat,var(--teal));display:flex;align-items:center;gap:5px}
.ins-cat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cat,var(--teal));box-shadow:0 0 7px var(--cat,var(--teal))}
.ins-head .icon-btn{margin-inline-start:auto}
.ins-title{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.35;letter-spacing:.1px}
.ins-blurb{font-size:11.5px;line-height:1.75;color:rgba(223,202,160,.72);margin-top:7px}
.ins-fx{display:flex;flex-direction:column;gap:5px;margin:14px 0 0}
.ins-fx .fxrow{padding:8px 10px;border-radius:10px;background:rgba(7,18,16,.34);border:1px solid rgba(223,202,160,.07);font-size:11.5px}
.ins-fx .fxrow b{font-family:var(--serif);font-size:15px;letter-spacing:.4px}
.ins-cost{margin-top:13px;padding:11px 12px;border-radius:12px;background:rgba(7,18,16,.36);border:1px solid rgba(223,202,160,.09)}
.cost-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:rgba(223,202,160,.7)}
.cost-row b{font-family:var(--serif);font-size:16px;color:var(--gold);font-weight:700}
.cost-row b.teal{color:#8ff0df}
.pcbar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07);margin:8px 0 7px}
.pcbar i{display:block;height:100%}
.pcbar .seg-spent{background:rgba(223,202,160,.38)}
.pcbar .seg-this{background:linear-gradient(90deg,#f2cf77,#ffe9ab)}
.pcbar .seg-left{background:rgba(78,199,180,.35)}
.cost-legend{display:flex;gap:9px;flex-wrap:wrap;font-size:8.5px;color:rgba(223,202,160,.5)}
.cost-legend i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-inline-end:3px}
.cost-previews{display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(223,202,160,.12)}
.cost-previews div{display:flex;flex-direction:column;gap:1px}
.cost-previews span{font-size:8.5px;color:rgba(223,202,160,.5)}
.cost-previews b{font-family:var(--serif);font-size:17px;color:var(--wheat);font-weight:700}
.cost-previews b small{font-family:var(--sans);font-size:8px;color:rgba(223,202,160,.5);font-weight:400;margin-inline-start:2px}
.ins-note{font-size:9.5px;color:rgba(223,202,160,.55);line-height:1.5;margin-top:9px;display:flex;align-items:center;gap:4px}
.ins-actions{flex:none;padding:10px 17px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(4,12,10,.6) 30%);
  display:flex;flex-direction:column;gap:8px}
.cta{
  width:100%;min-height:52px;border-radius:12px;border:1px solid rgba(242,207,119,.65);
  background:linear-gradient(180deg,#fbe9b8,#eecb6d 58%,#d7a93f);color:#251a03;
  font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.2px;cursor:pointer;
  box-shadow:0 12px 26px -10px rgba(242,207,119,.55),inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .15s,filter .2s;
}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cta:active{transform:translateY(1px) scale(.995)}
.cta:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.ins-foot{display:flex;align-items:center;justify-content:center;gap:4px;font-size:8.5px;color:rgba(223,202,160,.45);text-align:center}
.ins-end{display:none;align-items:center;gap:8px;padding-top:2px}
.mini-seal{
  width:48px;height:48px;flex:none;border-radius:50%;border:1px solid rgba(242,207,119,.55);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#f8e6b0,#e4bd59 65%,#c79a31);color:#3a2705;cursor:pointer;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.6);position:relative;
}
.mini-seal b{font-family:var(--serif);font-size:13px;line-height:1}
.ins-pend{font-size:9.5px;line-height:1.5;color:rgba(223,202,160,.65);flex:1;min-width:0}
.ins-pend b{color:var(--gold)}
.ins-pend span{display:block;color:rgba(223,202,160,.45);font-size:8.5px}

/* ---------- event ---------- */
#eventLayer{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;
  background:radial-gradient(70% 60% at 50% 45%,rgba(36,12,17,.55),rgba(3,9,8,.86) 70%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto;
}
body[data-state="4"] #eventLayer{display:grid}
.evwrap{width:min(700px,96vw);max-height:none;margin:auto}
.evcard{
  position:relative;border-radius:20px;overflow:hidden;padding:0;max-height:92dvh;overflow:auto;
  border:1px solid rgba(248,113,113,.35);
  background:linear-gradient(168deg,#20322c 0%,#122420 45%,#0a1714 100%);
  box-shadow:0 50px 100px -30px #000,0 0 0 1px rgba(206,17,38,.12) inset;
  animation:evIn .5s cubic-bezier(.2,.9,.25,1.05) both;
}
.ev-strip{height:6px;background:linear-gradient(90deg,#ce1126,#f87171 45%,#f2cf77)}
.ev-top{display:flex;align-items:center;gap:8px;padding:13px 18px 0}
.ev-urgent{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:.8px;
  color:#ffb4b4;background:rgba(206,17,38,.18);border:1px solid rgba(248,113,113,.4);
}
.ev-urgent .dot{width:5px;height:5px;border-radius:50%;background:#f87171;box-shadow:0 0 8px #f87171;animation:blink 1.7s infinite}
.ev-src{font-size:9.5px;color:rgba(223,202,160,.55);line-height:1.5}
.ev-top .icon-btn{margin-inline-start:auto}
.ev-body{padding:8px 18px 16px}
.ev-cat{font-size:9px;letter-spacing:1.4px;color:rgba(248,113,113,.8);margin-bottom:5px}
.ev-title{font-family:var(--serif);font-size:clamp(23px,2.6vw,32px);font-weight:700;line-height:1.28;letter-spacing:.1px}
.ev-desc{font-size:12.5px;line-height:1.85;color:rgba(223,202,160,.76);margin-top:9px}
.ev-note{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(242,207,119,.72);margin-top:11px;
  padding:7px 10px;border-radius:8px;background:rgba(242,207,119,.06);border:1px solid rgba(242,207,119,.16)}
.ev-opts{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.opt{
  display:block;width:100%;text-align:start;padding:11px 13px 10px;border-radius:13px;cursor:pointer;
  border:1px solid rgba(223,202,160,.13);background:rgba(7,18,16,.42);color:var(--wheat);
  transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;position:relative;
}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(78,199,180,.45);background:rgba(19,56,50,.6)}
.opt.picked{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(242,207,119,.07)}
.opt:disabled{opacity:.52;cursor:not-allowed;filter:saturate(.6)}
.opt-top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.opt-idx{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:10px;
  background:rgba(223,202,160,.08);border:1px solid rgba(223,202,160,.16);color:rgba(223,202,160,.7)}
.opt h4,.opt-title{font-family:var(--serif);font-size:14.5px;font-weight:700;line-height:1.5;flex:1;min-width:60%}
.opt-costs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
.opt p,.opt-desc{display:block;font-size:10.5px;line-height:1.7;color:rgba(223,202,160,.6);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt-fx{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.opt-note{display:flex;align-items:flex-start;gap:4px;font-size:9px;color:rgba(223,202,160,.42);line-height:1.5;margin-top:5px}
.opt-lock{display:flex;align-items:center;gap:4px;font-size:9.5px;color:#ff9c9c;margin-top:6px}

/* ---------- results ---------- */
#resultsLayer{
  position:fixed;inset:0;z-index:70;display:none;overflow:auto;
  background:
    radial-gradient(900px 600px at 50% -10%,rgba(19,56,50,.7),transparent 65%),
    radial-gradient(700px 500px at 85% 100%,rgba(36,12,17,.45),transparent 70%),
    #050f0d;
}
body[data-state="5"] #resultsLayer{display:block}
.results{width:min(1180px,100%);margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}
.masthead{margin-bottom:10px;animation:fadeUp .5s both}
.mh-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(223,202,160,.35),transparent)}
.mh-rule.thick{height:3px;border-top:1px solid rgba(223,202,160,.45);border-bottom:1px solid rgba(223,202,160,.18);background:none;margin-top:4px}
.mh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px}
.mh-row h1{font-family:var(--serif);font-size:clamp(24px,4vw,42px);font-weight:700;letter-spacing:.5px;line-height:1;text-align:center;flex:1}
.mh-side{font-size:9px;letter-spacing:1.4px;color:rgba(223,202,160,.55);white-space:nowrap}
.mh-sub{text-align:center;font-size:9.5px;letter-spacing:2px;color:rgba(78,199,180,.7);padding:2px 0 5px}
.newsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
.news{
  position:relative;border-radius:5px;padding:11px 14px 9px;color:#16221d;
  background-color:#f4f0e3;
  background-image:repeating-linear-gradient(0deg,rgba(22,34,29,.022) 0 1px,transparent 1px 3px);
  box-shadow:0 20px 40px -18px rgba(0,0,0,.85),inset 0 0 0 1px rgba(120,100,60,.12);
  transform:rotate(var(--tilt,0deg));
  animation:paperIn .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*95ms);
}
.news.lead{grid-column:1/-1;padding:14px 18px 11px}
.news::before{content:'';position:absolute;inset-block-start:0;inset-inline:0;height:3px;background:#16221d;opacity:.82}
.news.lead::before{height:5px;background:linear-gradient(90deg,#8f1d24,#16221d 55%)}
.news-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid rgba(22,34,29,.25)}
.news-cat{font-size:9px;font-weight:700;letter-spacing:1.8px;color:#8a5a1e}
.news-date{font-size:8.5px;color:#8c948d;letter-spacing:.6px}
.news h3{font-family:var(--serif);font-weight:700;font-size:clamp(17px,1.8vw,23px);line-height:1.3;margin:6px 0 4px;color:#14201b}
.news.lead h3{font-size:clamp(22px,2.5vw,31px);line-height:1.24}
.news p{font-size:11.5px;line-height:1.8;color:#4c564f;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(22,34,29,.16)}
.news-stat{display:flex;align-items:baseline;gap:0;font-family:var(--serif);color:#14201b;line-height:1;direction:ltr}
.news-stat b{font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:.3px}
.news-stat .nu{font-family:var(--sans);font-size:9px;color:#6c766e;font-weight:500}
.news-stat .nu.u{margin-inline-start:3px}
.news .chip{font-size:8.5px}
.news .chip.bad{color:#9c1b1b;background:rgba(206,17,38,.09);border-color:rgba(206,17,38,.25)}
.news .chip.good{color:#0b6b57;background:rgba(63,185,80,.1);border-color:rgba(31,122,90,.3)}
.byline{font-size:8px;color:#8f968f;letter-spacing:.3px}
.stamp{
  position:absolute;inset-block-start:12px;inset-inline-end:12px;transform:rotate(9deg);
  font-size:8.5px;font-weight:700;letter-spacing:1.6px;color:rgba(143,29,36,.62);
  border:2px solid rgba(143,29,36,.35);border-radius:4px;padding:2px 5px;opacity:.85;pointer-events:none;
}
.summary{
  margin-top:16px;border-radius:16px;padding:14px;animation:paperIn .5s .55s both;
}
.sum-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sum-h span{font-family:var(--serif);font-size:16px;font-weight:700}
.sum-h b{font-size:9px;font-weight:400;color:rgba(223,202,160,.5);letter-spacing:.6px}
.sum-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sum{padding:8px 10px;border-radius:10px;background:rgba(7,18,16,.4);border:1px solid rgba(223,202,160,.08)}
.sum>span{display:block;font-size:8.5px;color:rgba(223,202,160,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-val{display:flex;align-items:baseline;gap:0;margin:2px 0 4px;flex-wrap:wrap;direction:ltr}
.sum-val b{font-family:var(--serif);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sum-val i{font-style:normal;font-size:8px;color:rgba(223,202,160,.5);margin-inline-start:3px}
.sum-val .suf{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--wheat)}
.sum-val .nu{font-size:9px;color:rgba(223,202,160,.55)}
.sum .chip{font-size:8px;padding:1px 4px}
.sum-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px}
.sum-foot .btn{min-height:46px;padding:0 22px;font-size:12.5px}
.sum-foot p{font-size:9px;color:rgba(223,202,160,.42);flex:1;min-width:160px;line-height:1.6}

/* ---------- toast ---------- */
.toast{
  position:fixed;z-index:90;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,18px);
  max-width:min(520px,calc(100vw - 32px));padding:10px 16px;border-radius:11px;pointer-events:none;
  background:rgba(8,22,19,.94);border:1px solid rgba(78,199,180,.35);color:var(--wheat);
  font-size:11.5px;line-height:1.6;box-shadow:0 18px 40px -12px #000;
  opacity:0;transition:opacity .25s,transform .3s;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- switcher ---------- */
.switcher{
  position:fixed;z-index:200;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:5px;padding:7px 9px;border-radius:10px;direction:ltr;text-align:left;
  background:rgba(4,10,9,.6);border:1px solid rgba(223,202,160,.2);color:#dfe;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;letter-spacing:.03em;
  opacity:.6;transition:opacity .2s;box-shadow:0 8px 20px -8px #000;
}
.switcher:hover,.switcher:focus-within{opacity:1}
.sw-top{display:flex;align-items:baseline;gap:6px;color:#f7f5ed;font-size:10px;font-weight:600}
.sw-top span{color:#7fd9c8;font-weight:400;font-size:9px;letter-spacing:.06em}
.sw-btns{display:flex;align-items:center;gap:3px}

    var p = project(g.center[0], g.center[1]);
    var W = card.offsetWidth || 322, H = card.offsetHeight || 380;
    var topbarH = window.innerHeight < 540 ? 58 : 78;
    var x = p.x + 92;
    if(x + W > window.innerWidth - 14) x = p.x - W - 92;
    x = clamp(x, 14, window.innerWidth - W - 14);
    var y = clamp(p.y - H*0.42, topbarH, window.innerHeight - H - 14);
    card.style.left = x+'px'; card.style.top = y+'px';
    card.style.width=''; card.style.maxHeight='';
    if(ring){ ring.style.left=p.x+'px'; ring.style.top=p.y+'px'; }
    if(lead){
      var ex = clamp(p.x, x, x+W), ey = clamp(p.y, y, y+H);
      var dx = ex-p.x, dy = ey-p.y, len = Math.sqrt(dx*dx+dy*dy);
      lead.style.left = p.x+'px'; lead.style.top = p.y+'px';
      lead.style.width = len+'px';

    var t=$('#toast'); if(!t) return;
    t.textContent = msg; t.classList.add('on');
    if(state.toastT) clearTimeout(state.toastT);
    state.toastT = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  }

  /* ---------------- wire ---------------- */
  function init(){
    var q = new URLSearchParams(window.location.search);
    if(q.get('bare')==='1') document.body.classList.add('bare');
    var start = parseInt(q.get('state'),10);
    if(!(start>=1&&start<=5)) start = 1;

    renderRes();
    var chev=$('#resChev'); if(chev) chev.innerHTML = icon('chevron',14);
    var pendIc=$('#pendIc'); if(pendIc) pendIc.innerHTML = icon('clock',13);
    var pendChev=$('#pendChev'); if(pendChev) pendChev.innerHTML = icon('chevron',11);
    var trayIc=$('#trayIc'); if(trayIc) trayIc.innerHTML = icon('radar',15);
    var trayClose=$('#trayClose'); if(trayClose) trayClose.innerHTML = icon('close',15);
    renderTray();
    renderMap();
    renderPins();
    renderHand();
    renderPending();

    var bar=$('#resbar');
    if(bar){
      bar.addEventListener('click', function(){ toggleTray(); });
      bar.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleTray(); } });
    }
    if(trayClose) trayClose.addEventListener('click', function(e){ e.stopPropagation(); closeTray(); });
    document.addEventListener('click', function(e){
      var tray=$('#tray'), rb=$('#resbar');
      if(!tray||!tray.classList.contains('open')) return;
      if(tray.contains(e.target)||(rb&&rb.contains(e.target))) return;
      closeTray();
    });

    var seal=$('#seal');
    if(seal) seal.addEventListener('click', function(){ setState(5); });
    var pendHead=$('#pendHead'), pending=$('#pending');
    if(pendHead && pending){
      pendHead.addEventListener('click', function(){
        pending.classList.toggle('exp');
        pendHead.setAttribute('aria-expanded', pending.classList.contains('exp')?'true':'false');
      });
    }

    $$('.sw-btns button').forEach(function(b){
      b.addEventListener('click', function(){ setState(+b.getAttribute('data-s')); });
    });
    document.addEventListener('keydown', function(e){
      if(e.key>='1'&&e.key<='5'){ setState(+e.key); }
      if(e.key==='Escape'){ setState(1); }
    });

    var resizeT;
    function onResize(){
      if(resizeT) cancelAnimationFrame(resizeT);
      resizeT = requestAnimationFrame(function(){
        layoutPins();
        positionProvince();
      });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function(){ setTimeout(onResize,180); });
    if(window.ResizeObserver){
      try{ new ResizeObserver(onResize).observe($('#mapwrap')); }catch(err){}
    }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ setTimeout(onResize,60); }); }

    setState(start);
    setTimeout(function(){ positionProvince(); layoutPins(); }, 90);
  }
  init();
})();
</script>
</body>
</html>
