.wrap{font-family:var(--font-sans,system-ui);color:var(--foreground)}
.intro{margin:0 0 20px;color:var(--muted-foreground,inherit);font-size:14px;line-height:1.5}
section{margin:0 0 40px}
h2{font-size:18px;margin:0 0 4px}
.lead{margin:0 0 14px;font-size:14px;line-height:1.5}
ul{margin:14px 0 0;padding-inline-start:18px;font-size:13.5px;line-height:1.55}
li{margin:0 0 4px}
.pair{display:flex;flex-wrap:wrap;gap:16px}
/* ---------- shared phone skeleton ---------- */
.ph{width:340px;max-width:100%;height:640px;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:TS,system-ui,sans-serif;font-size:12px;line-height:1.45;box-sizing:border-box}
.ph *{box-sizing:border-box}
.ph b{font-weight:700}
.ic{width:20px;height:20px;display:block}
.hud{flex:none}
.turn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px}
.turn .td{flex:1}
.res{display:grid;grid-template-columns:repeat(4,1fr)}
.rc{display:flex;flex-direction:column;padding:6px 8px 5px;min-width:0}
.rc .l{font-size:11px;white-space:nowrap;overflow:hidden}
.rc .v{direction:ltr;text-align:right;white-space:nowrap}
.rc .v b{font-size:19px;line-height:1.25}
.rc .v small{font-size:11px;margin-left:1px}
.rc i{font-style:normal;font-size:11px;direction:ltr;text-align:right;font-weight:700}
.modes{display:flex}
.modes span{flex:1;text-align:center;padding:7px 0;font-size:12px}
.map{flex:1;min-height:0;position:relative;display:flex}
.map svg{width:100%;height:100%}
.legend{position:absolute;inset-inline-start:8px;bottom:8px;display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 7px}
.legend i{width:11px;height:11px;display:inline-block;margin-inline-start:5px}
.legend i:first-child{margin:0}
.bottom{flex:none;display:flex;height:58px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-width:0}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.end b{font-size:14px}.end small{font-size:11px}
.sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:0 10px 8px}
.sh{display:flex;align-items:center;justify-content:space-between;height:42px;margin:0 -10px;padding:0 12px;flex:none}
.sh b{font-size:16px}
.budget{display:grid;grid-template-columns:1fr auto;gap:5px 8px;padding:8px 10px;align-items:center}
.bv{direction:ltr;font-size:13px}.bv b{font-size:17px}
.bar{grid-column:1/-1;height:8px;position:relative}
.bar u{position:absolute;inset-block:0;inset-inline-start:0;display:block}
.bar em{position:absolute;inset-block:-3px;inset-inline-start:40%;width:2px}
.filters{display:flex;gap:6px}
.filters span{padding:5px 9px;font-size:11.5px;white-space:nowrap}
.card{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:9px 10px}
.ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.ct .tag{font-size:11px}.ct b{font-size:13.5px;line-height:1.4}
.cost{width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cost b{font-size:19px}.cost small{font-size:10.5px}
.fx{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fx span{font-size:11px;padding:2px 6px;white-space:nowrap;font-weight:700}
.card .fx{grid-column:1}
.btn{grid-column:2;align-self:end;padding:8px 10px;font-size:12px;font-weight:700;text-align:center;white-space:nowrap}
.card{grid-template-columns:1fr auto}.card .fx{grid-column:1/-1}.card .btn{grid-column:1/-1}
.lever{padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.lt{display:flex;justify-content:space-between;align-items:center}.lt b{font-size:13px}.lv{font-size:17px;font-weight:700;direction:ltr}
.lr{display:flex;align-items:center;gap:8px}
.st{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.track{flex:1;height:8px;position:relative}
.track u{position:absolute;inset-block:0;inset-inline-start:0;width:48%;display:block}
.track em{position:absolute;top:-8px;inset-inline-start:calc(48% - 7px);width:14px;height:24px}
.tray{flex:none;display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 12px;font-size:12px;font-weight:700}

/* ================= A · Operations Console ================= */
.A{background:#0b0f12;color:#e8ebec;border:1px solid #2b353d}
.A .turn{background:#12181d;border-bottom:1px solid #2b353d;color:#9aa7ae}
.A .turn b{color:#f2b233;font-size:15px}.A .tn{color:#e8ebec}.A .gear{color:#9aa7ae}
.A .res{border-bottom:1px solid #2b353d;background:#0f1418}
.A .rc{border-inline-start:1px solid #2b353d}.A .rc:first-child{border:0}
.A .rc .l{color:#9aa7ae}.A .rc .v small{color:#9aa7ae}
.A .up{color:#58c988}.A .dn{color:#f0665a}.A .eq{color:#56636b}
.A .modebar{border-bottom:1px solid #2b353d;background:#0f1418}
